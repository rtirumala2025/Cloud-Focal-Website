<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" fill="none">
  <defs>
    <linearGradient id="cf-cloud-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#37b5ff" />
      <stop offset="100%" stop-color="#5371ff" />
    </linearGradient>
  </defs>

  <!-- Cloud Body -->
  <g id="cloud-mark">
    <!-- Cloud Silhouette Path -->
    <path d="M 120 190 
             A 50 50 0 0 1 80 105 
             A 65 65 0 0 1 185 55 
             A 75 75 0 0 1 315 90 
             A 55 55 0 0 1 320 190 
             Z" 
          fill="url(#cf-cloud-grad)" />

    <!-- Network Lines Connecting Nodes -->
    <line x1="185" y1="25" x2="230" y2="125" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    <line x1="285" y1="60" x2="230" y2="125" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    <line x1="60" y1="160" x2="230" y2="125" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    <line x1="230" y1="205" x2="230" y2="125" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    <line x1="345" y1="165" x2="230" y2="125" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />

    <!-- Terminal Nodes -->
    <circle cx="185" cy="25" r="16" fill="#ffffff" />
    <circle cx="285" cy="60" r="16" fill="#ffffff" />
    <circle cx="60" cy="160" r="16" fill="#ffffff" />
    <circle cx="230" cy="205" r="16" fill="#ffffff" />
    <circle cx="345" cy="165" r="16" fill="#ffffff" />

    <!-- Central Hub / Focal Node (Concentric ring) -->
    <circle cx="230" cy="125" r="28" fill="#ffffff" />
    <circle cx="230" cy="125" r="15" fill="#5371ff" />
  </g>

  <!-- Typography -->
  <text x="200" y="252" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="34" 
        font-weight="500" 
        letter-spacing="0.5px"
        fill="#08104d">
    Cloud Focal Inc
  </text>
</svg>
